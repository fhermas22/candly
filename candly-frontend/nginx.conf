#----------------------------------------------------------------
# Nginx configuration for serving the React application
#----------------------------------------------------------------

server {
    # Listen on port 80 for HTTP requests
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing : redirect all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve static assets with long-term caching (1 year) for better performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # Security: Deny access to hidden files (e.g., .htaccess, .env)
    location ~ /\. {
        deny all;
    }

    # Disable access logs for the favicon (unnecessary noise)
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
# ────────────────────────────────────────────────────────────────────────
# Candly — CI/CD Pipeline
# ────────────────────────────────────────────────────────────────────────

name: CI/CD — Candly

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # JOB 1 — Laravel tests with Pest
  # ═══════════════════════════════════════════════════════════════════════
  test-backend:
    name: Laravel Tests (Pest)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: candly_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Step 1 - Retrieve the source code
        uses: actions/checkout@v4

      - name: Step 2 - Configuring PHP 8.4 with required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, zip, gd, bcmath
          coverage: none

      - name: Step 3 - Cache the Composer dependencies
        uses: actions/cache@v4
        with:
          path: candly-api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('candly-api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Step 4 - Install PHP dependencies
        working-directory: ./candly-api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Step 5 - Create the .env file
        working-directory: ./candly-api
        run: cp .env.example .env

      - name: Step 6 - Generate the Laravel application key
        working-directory: ./candly-api
        run: php artisan key:generate

      - name: Step 7 - Run the migrations
        working-directory: ./candly-api
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: candly_test
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Step 8 - Run the Pest tests
        working-directory: ./candly-api
        run: composer run test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: candly_test
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

  # ═══════════════════════════════════════════════════════════════════════
  # JOB 2 — Lint ESLint + Build React
  # ═══════════════════════════════════════════════════════════════════════
  test-frontend:
    name: Lint + Build React
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Retrieve the source code
        uses: actions/checkout@v4

      - name: Step 2 - Configuring Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: candly-frontend/package-lock.json

      - name: Step 3 - Install npm dependencies
        working-directory: ./candly-frontend
        run: npm ci

      - name: Step 4 - Verify ESLint
        working-directory: ./candly-frontend
        run: npm run lint

      - name: Step 5 - Build production React
        working-directory: ./candly-frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000/api

  # ═══════════════════════════════════════════════════════════════════════
  # JOB 3 — Build Docker images (main only)
  # ═══════════════════════════════════════════════════════════════════════
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Step 1 - Retrieve the source code
        uses: actions/checkout@v4

      - name: Step 2 - Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Step 3 - Build Laravel image
        uses: docker/build-push-action@v5
        with:
          context: ./candly-api
          push: false
          tags: candly-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Step 4 - Build React image
        uses: docker/build-push-action@v5
        with:
          context: ./candly-frontend
          push: false
          tags: candly-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════════════
  # JOB 4 — Deploy to VPS (main only)
  # ═══════════════════════════════════════════════════════════════════════
  deploy:
    name: Server Deployment
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, build-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Step 1 - Code Checkout
        uses: actions/checkout@v4

      - name: Step 2 - Deployment via SSH on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /home/deployer/candly/candly/
            git pull origin main
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d
            sleep 15
            docker compose -f docker-compose.prod.yml exec -T laravel \
              php artisan migrate --force
            docker compose -f docker-compose.prod.yml exec -T laravel \
              php artisan cache:clear
            docker system prune -f

      - name: Step 3 - Post-deployment health check
        run: |
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://${{ secrets.CANDLY_DOMAIN }}/api/health)
          [ "$STATUS" = "200" ] && echo "OK" || (echo "FAIL HTTP $STATUS"; exit 1)
